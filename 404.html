<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trattoria</title>
  <!--
    GitHub Pages has no SPA fallback. Unknown paths land here and are redirected to the app's
    index.html with the path encoded in the query string; index.html restores the real URL.
    (Based on rafgraph/spa-github-pages, project-site variant: keep 1 path segment.)
  -->
  <script>
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
