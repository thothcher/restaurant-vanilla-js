  <script>
    // GitHub Pages: (1) restore the real URL after the 404.html redirect, (2) project sites live under
    // /<repo>/ while local dev serves from /, so set <base> accordingly. See 404.html and js/config.js.
    (function (l) {
      if (l.search[1] === '/') {
        var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
      }
      var base = /\.github\.io$/.test(l.hostname) ? '/' + l.pathname.split('/')[1] + '/' : '/';
      window.__BASE__ = base;
      document.write('<base href="' + base + '">');
    })(window.location);
  </script>
